        '<small>' + escapeHtml(when) + '</small></button>';
    }).join('');
    el.fileList.querySelectorAll('[data-file-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        pickFile(btn.getAttribute('data-file-id'));
      });
    });
  }

  function pickFile(fileId) {
    el.fileStatus.textContent = 'Loading mice…';
    gasRun('loadPlanningSheet', trackerAuthFields_({
      fileId: fileId,
      spreadsheetId: fileId || pipeline.spreadsheetId || ''
    })).then(function (source) {
      var saved = readSaved();
      if (saved && saved.miceById) {
        var merged = hydrateState(mergeMiceIntoState(saved, source));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        showSavedResume();
      }
      pendingSource = source;
      setupCount = STATION_MIN;
      setupStudents = [];
      renderStationSetup();
    }).catch(function (error) {
      el.fileStatus.textContent = error && error.message ? error.message : 'Failed to load sheet.';
    });
  }

  function refreshFromSheet() {
    if (!pipeline.spreadsheetId || refreshing) return;
    refreshing = true;
    if (el.syncStatus) el.syncStatus.textContent = 'Refreshing from the planning sheet…';
    if (el.fileStatus && !sessionActive) el.fileStatus.textContent = 'Refreshing from the planning sheet…';
    gasRun('loadPlanningSheet', trackerAuthFields_({
      fileId: pipeline.spreadsheetId,
      spreadsheetId: pipeline.spreadsheetId
    })).then(function (source) {
      refreshing = false;
      if (state && sessionActive) {
        state = hydrateState(mergeMiceIntoState(state, source));
        persist();
        renderAll();
        if (el.syncStatus) el.syncStatus.textContent = 'Planning sheet merged.';
        return;
      }
      var saved = readSaved();
      if (saved && saved.miceById) {
        var merged = hydrateState(mergeMiceIntoState(saved, source));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        showSavedResume();
      }
      pendingSource = source;
      if (el.fileStatus) el.fileStatus.textContent = 'Planning sheet merged.';
      renderStationSetup();
    }).catch(function (error) {
      refreshing = false;
      var message = error && error.message ? error.message : 'Failed to refresh the planning sheet.';
      if (el.syncStatus && sessionActive) el.syncStatus.textContent = message;
      if (el.fileStatus && !sessionActive) el.fileStatus.textContent = message;
    });
  }

  function mouseIdentity_(mouse) {
    var cage = String((mouse && mouse.cage) || '').trim().toLowerCase();
    var pyrat = String((mouse && mouse.pyrat) || '').trim().toLowerCase();
    var tag = String((mouse && mouse.tag) || '').trim().toLowerCase();
    var no = String((mouse && (mouse.mouseNo || mouse.id)) || '').trim().toLowerCase();
    if (cage && pyrat) return 'c:' + cage + '|p:' + pyrat;
    if (cage && tag && no) return 'c:' + cage + '|t:' + tag + '|n:' + no;
    if (cage && no) return 'c:' + cage + '|n:' + no;
    if (pyrat) return 'p:' + pyrat;
    return 'row:' + String((mouse && mouse.sheetRow) || '') + '|n:' + no;
  }

  function hasRecordedWork_(mouse) {
    if (!mouse) return false;
    if (mouse.status && mouse.status !== 'queued') return true;
    if (mouse.sacTime || mouse.bloodTime || mouse.generalNotes || mouse.notes) return true;
    if ((mouse.selectedOrgans || []).length) return true;
    if ((mouse.pathology || []).length) return true;
    if ((mouse.internalSwaps || []).length || (mouse.crossSwaps || []).length) return true;
    var organs = mouse.organs || {};
    var name;
    for (name in organs) {
      if (!Object.prototype.hasOwnProperty.call(organs, name)) continue;
      if (organs[name] && (organs[name].missing || organs[name].pfa)) return true;
    }
    var weights = mouse.weights || {};
    var key;
    for (key in weights) {
      if (!Object.prototype.hasOwnProperty.call(weights, key)) continue;
      if (String(weights[key] || '').trim()) return true;
    }
    return false;
  }

  function copyRecorded_(target, prev) {
    var weights = target.weights || {};
    var prevWeights = prev.weights || {};
    var key;
    for (key in prevWeights) {
      if (!Object.prototype.hasOwnProperty.call(prevWeights, key)) continue;
      if (String(prevWeights[key] || '').trim()) weights[key] = prevWeights[key];
    }
    target.weights = weights;
    target.status = prev.status || target.status;
    target.sacTime = prev.sacTime || '';
    target.bloodTime = prev.bloodTime || '';
    target.selectedOrgans = (prev.selectedOrgans || []).slice();
    target.organs = prev.organs || target.organs;
    target.pathology = prev.pathology || [];
    target.internalSwaps = prev.internalSwaps || [];
    target.crossSwaps = prev.crossSwaps || [];
    target.generalNotes = prev.generalNotes || '';
    target.notes = prev.notes || '';
    target.student = prev.student || '';
    target.stationIndex = prev.stationIndex == null || prev.stationIndex === '' ? null : Number(prev.stationIndex);
  }

  function mergeMiceIntoState(baseState, source) {
    var stationCount = baseState.stationCount || STATION_MIN;
    var students = baseState.stationStudents || [];
    var fresh = createState(source, stationCount, students);
    var oldByKey = {};
    Object.keys(baseState.miceById || {}).forEach(function (id) {
      var mouse = baseState.miceById[id];
      oldByKey[mouseIdentity_(mouse)] = mouse;
    });
    var consumed = {};
    Object.keys(fresh.miceById).forEach(function (id) {
      var mouse = fresh.miceById[id];
      var key = mouseIdentity_(mouse);
      var prev = oldByKey[key];
      if (!prev || !hasRecordedWork_(prev)) return;
      consumed[key] = true;
      copyRecorded_(mouse, prev);
    });
    Object.keys(baseState.miceById || {}).forEach(function (id) {
      var mouse = baseState.miceById[id];
      var key = mouseIdentity_(mouse);
      if (consumed[key] || !hasRecordedWork_(mouse)) return;
      if (!fresh.miceById[mouse.id]) fresh.miceById[mouse.id] = mouse;
    });
    fresh.stationSlots = [];
    var oldSlots = baseState.stationSlots || [];
    var s;
    for (s = 0; s < fresh.stationCount; s++) {
      var slot = oldSlots[s];
      fresh.stationSlots.push(slot && fresh.miceById[String(slot)] ? slot : null);
    }
    var inStation = {};
    fresh.stationSlots.forEach(function (id, index) {
      if (!id || !fresh.miceById[String(id)]) return;
      inStation[String(id)] = true;
      fresh.miceById[String(id)].stationIndex = index;
    });
    Object.keys(fresh.miceById).forEach(function (id) {
      var mouse = fresh.miceById[id];
      if (!mouse || mouse.status !== 'active' || inStation[String(id)]) return;
      var idx = mouse.stationIndex == null || mouse.stationIndex === '' ? -1 : Number(mouse.stationIndex);
      if (idx >= 0 && idx < fresh.stationCount && !fresh.stationSlots[idx]) {
        fresh.stationSlots[idx] = String(id);
        inStation[String(id)] = true;
        mouse.stationIndex = idx;
        return;
      }
      mouse.status = 'queued';
      mouse.stationIndex = null;
    });
    var order = [];
    (baseState.queueOrder || []).forEach(function (id) {
      var mouse = fresh.miceById[id];
      if (!mouse || mouse.status !== 'queued' || inStation[String(id)] || order.indexOf(id) >= 0) return;
      order.push(id);
    });
    Object.keys(fresh.miceById).forEach(function (id) {
      var mouse = fresh.miceById[id];
      if (mouse.status !== 'queued' || inStation[String(id)] || order.indexOf(id) >= 0) return;
      order.push(id);
    });
    fresh.queueOrder = order;
    fresh.iceTimers = baseState.iceTimers || [];
    fresh.exported = !!baseState.exported;
    fresh.startedAtMs = baseState.startedAtMs || Date.now();
    fresh.completedAtMs = baseState.completedAtMs || null;
    fresh.exportFileId = baseState.exportFileId || '';
    fresh.exportUrl = baseState.exportUrl || '';
    fresh.exportFileName = baseState.exportFileName || '';
    fresh.lastSyncOk = typeof baseState.lastSyncOk === 'undefined' ? null : baseState.lastSyncOk;
    fresh.source = source;
    fresh.updatedAt = Date.now();
    return fresh;
  }

  function hideStationSetup() {
    pendingSource = null;
    if (el.stationSetup) el.stationSetup.classList.add('hidden');
    if (el.fileList) el.fileList.classList.remove('hidden');
    if (el.fileStatus) el.fileStatus.classList.remove('hidden');
  }

  function renderStationSetup() {
    if (!pendingSource || !el.stationSetup) return;
    el.fileList.classList.add('hidden');
    el.fileStatus.classList.add('hidden');
    el.stationSetup.classList.remove('hidden');
    el.stationSetupFile.textContent = pendingSource.fileName || 'Planning sheet';
    var counts = '';
    for (var n = STATION_MIN; n <= STATION_MAX; n++) {
      counts += '<button type="button" class="count-btn' + (n === setupCount ? ' is-on' : '') +
        '" data-count="' + n + '">' + n + '</button>';
    }
    el.stationCountBtns.innerHTML = counts;
    el.stationCountBtns.querySelectorAll('[data-count]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setupCount = Number(btn.getAttribute('data-count'));
        renderStationSetup();
      });
    });
    var students = pendingSource.students || [];
    ensureStudentList_(students);
    var fields = '';
    for (var i = 0; i < setupCount; i++) {
      var selected = setupStudents[i] || '';
      fields += '<label class="field">Station ' + (i + 1) +
        '<input type="text" autocomplete="off" placeholder="Type a name" data-setup-slot="' + i +
        '" list="station-student-list" value="' + escapeHtml(selected) + '"></label>';
    }
    el.stationAssign.innerHTML = fields;
    el.stationAssign.querySelectorAll('[data-setup-slot]').forEach(function (input) {
      input.addEventListener('input', function () {
        setupStudents[Number(input.getAttribute('data-setup-slot'))] = input.value;
        refreshStartButton();
      });
    });
    refreshStartButton();
  }

  function refreshStartButton() {
    if (!el.btnStartStations) return;
    var ready = true;
    for (var i = 0; i < setupCount; i++) {
      if (!String(setupStudents[i] || '').trim()) ready = false;
    }
    el.btnStartStations.disabled = !ready;
  }

  function confirmStationSetup() {
    if (!pendingSource) return;
    var names = [];
    for (var i = 0; i < setupCount; i++) {
      if (!String(setupStudents[i] || '').trim()) return;
      names.push(String(setupStudents[i]).trim());
    }
    var source = pendingSource;
    pendingSource = null;
    hideStationSetup();
    startSession(createState(source, setupCount, names));
  }

  function createState(source, stationCount, stationStudents) {
    stationCount = stationCount || STATION_MIN;
    stationStudents = stationStudents || [];
    var miceById = {};
    var queueOrder = [];
    var chips = source.chips || [];
    var fields = source.weightFields || [];
    (source.mice || []).forEach(function (raw) {
      var id = String(raw.mouseNo || raw.id);
      var organs = {};
      chips.forEach(function (chip) {
        organs[chip] = { missing: false, pfa: false };
      });
      var weights = {};
      fields.forEach(function (field) {
        var seeded = raw.weights && raw.weights[field.key] != null ? String(raw.weights[field.key]) : '';
        weights[field.key] = seeded;
      });
      miceById[id] = {
        id: id,
        mouseNo: id,
        pyrat: raw.pyrat || '',
        tag: raw.tag || '',
        sex: raw.sex || '',
        genotype: raw.genotype || '',
        cage: raw.cage || '',
        age: raw.age || '',
        treatment: raw.treatment || '',
        sheetRow: raw.sheetRow || null,
        cells: raw.cells || {},
        weights: weights,
        status: 'queued',
        sacTime: '',
        bloodTime: '',
        selectedOrgans: [],
        organs: organs,
        pathology: [],
        internalSwaps: [],
        crossSwaps: [],
        generalNotes: '',
        notes: '',
        student: ''
      };
      queueOrder.push(id);
    });
    var slots = [];
    var names = [];
    for (var s = 0; s < stationCount; s++) {
      slots.push(null);
      names.push(stationStudents[s] || '');
    }
    return {
      source: source,
      miceById: miceById,
      stationCount: stationCount,
      stationStudents: names,
      stationSlots: slots,
      iceTimers: [],
      queueOrder: queueOrder,
      exported: false,
      startedAtMs: Date.now(),
      completedAtMs: null,
      exportFileId: '',
      exportUrl: '',
      exportFileName: '',
      lastSyncOk: null,
      updatedAt: Date.now()
    };
  }

  function hydrateState(nextState) {
    if (!nextState.startedAtMs) nextState.startedAtMs = Date.now();
    if (!nextState.exportFileId) nextState.exportFileId = '';
    if (!nextState.exportUrl) nextState.exportUrl = '';
    if (!nextState.exportFileName) nextState.exportFileName = '';
    if (typeof nextState.lastSyncOk === 'undefined') nextState.lastSyncOk = null;
    var count = Number(nextState.stationCount) || (nextState.stationSlots || []).length || STATION_MIN;
    if (count < STATION_MIN) count = STATION_MIN;
    if (count > STATION_MAX) count = STATION_MAX;
    nextState.stationCount = count;
    if (!Array.isArray(nextState.stationStudents)) nextState.stationStudents = [];
    if (!Array.isArray(nextState.stationSlots)) nextState.stationSlots = [];
    while (nextState.stationStudents.length < count) nextState.stationStudents.push('');
    while (nextState.stationSlots.length < count) nextState.stationSlots.push(null);
    nextState.stationStudents = nextState.stationStudents.slice(0, count);
    nextState.stationSlots = nextState.stationSlots.slice(0, count);
    var fields = (nextState.source && nextState.source.weightFields) || [];
    Object.keys(nextState.miceById || {}).forEach(function (id) {
      normalizeMouse(nextState.miceById[id], fields);
    });
    return nextState;
  }

  function normalizeMouse(mouse, fields) {
    if (!mouse.organs) mouse.organs = {};
    Object.keys(mouse.organs).forEach(function (name) {
      mouse.organs[name] = readOrgan(mouse, name);
    });
    mouse.pathology = (mouse.pathology || []).map(function (item) {
      if (item && Array.isArray(item.tags)) {
        return {
          organ: item.organ,
          tags: item.tags.slice(),
          text: item.text || '',
          pfa: !!item.pfa
        };
      }
      return {
        organ: item && item.organ,
        tags: item && item.type ? [item.type] : [],
        text: (item && item.text) || '',
        pfa: !!(item && item.pfa)
      };
    });
    if (!Array.isArray(mouse.selectedOrgans)) mouse.selectedOrgans = [];
    if (!mouse.weights || typeof mouse.weights !== 'object') mouse.weights = {};
    fields.forEach(function (field) {
      if (mouse.weights[field.key] == null) mouse.weights[field.key] = '';
    });
    if (mouse.generalNotes == null) mouse.generalNotes = '';
    if (!mouse.cells) mouse.cells = {};
    if (!Array.isArray(mouse.internalSwaps)) mouse.internalSwaps = [];
    if (!Array.isArray(mouse.crossSwaps)) mouse.crossSwaps = [];
    if (mouse.sheetRow == null) mouse.sheetRow = null;
    if (mouse.student == null) mouse.student = '';
  }

  function hasBloodColumn() {
    return !!(state && state.source && state.source.hasBloodColumn);
  }

  function stationCount() {
    return state && state.stationCount ? state.stationCount : STATION_MIN;
  }

  function startSession(nextState) {
    unlockAudio();
    completionSyncFired = false;
    state = hydrateState(nextState);
    sessionActive = true;
    persist();
    el.setup.classList.add('hidden');
    el.app.classList.remove('hidden');
    startWakeLock();
    startTicks();
    renderAll();
    tickIce(true);
  }

  function endSession(clearStorage) {
    sessionActive = false;
    completionSyncFired = false;
    stopTicks();
    stopWakeLock();
    if (clearStorage && STORAGE_KEY) localStorage.removeItem(STORAGE_KEY);
    if (clearStorage && LEGACY_STORAGE_KEY) localStorage.removeItem(LEGACY_STORAGE_KEY);
    state = null;
    el.app.classList.add('hidden');
    el.setup.classList.remove('hidden');
    if (el.completeScreen) {
      el.completeScreen.classList.add('hidden');
      el.completeScreen.setAttribute('aria-hidden', 'true');
    }
    el.syncStatus.textContent = '';
    if (!pipeline.spreadsheetId) {
      showMissingContext();
      return;
    }
    showSavedResume();
    pickFile(pipeline.spreadsheetId);
  }

  function mouseById(id) {
    return state && state.miceById ? state.miceById[String(id)] : null;
  }

  function allMice() {
    if (!state) return [];
    return Object.keys(state.miceById).map(function (id) { return state.miceById[id]; });
  }

  function isTerminal(mouse) {
    return !!(mouse && (mouse.status === 'done' || mouse.status === 'missing'));
  }

  function sessionComplete() {
    var mice = allMice();
    return mice.length > 0 && mice.every(isTerminal);
  }

  function renderAll() {
    if (!state) return;
    var meta = (state.source && state.source.meta) || {};
    var source = state.source || {};
    var title = meta['Experiment / Protocol'] || source.projectName || source.fileName || 'Session';
    el.expTitle.textContent = title;
    var student = source.studentName || meta.Researcher || '';
    var project = source.projectName || '';
    var bits = [];
    if (student) bits.push(student);
    if (project && project !== title) bits.push(project);
    if (meta['Sacrifice date']) bits.push(meta['Sacrifice date']);
    el.expMeta.textContent = bits.join(' · ');
    var sheetUrl = source.spreadsheetUrl || '';
    if (el.expSheetLink) {
      if (sheetUrl) {
        el.expSheetLink.href = sheetUrl;
        el.expSheetLink.classList.remove('hidden');
      } else {
        el.expSheetLink.classList.add('hidden');
      }
    }
    var done = allMice().filter(isTerminal).length;
    el.progressLabel.innerHTML = done + '<span> / ' + allMice().length + ' done</span>';
    if (el.board) el.board.classList.toggle('no-blood', !hasBloodColumn());
    renderIce();
    renderStations();
    renderQueue();
    renderComplete();
    if (sessionComplete() && !completionSyncFired) {
      if (!state.completedAtMs) state.completedAtMs = Date.now();
      completionSyncFired = true;
      persist();
      renderComplete();
      onSync({ auto: true });
    }
  }

  function remainingMs(timer) {
    return ICE_MS - (Date.now() - Number(timer.startedAtMs || 0));
  }

  function formatCountdown(ms) {
    var left = Math.max(0, ms);
    var totalSec = Math.floor(left / 1000);
    var min = Math.floor(totalSec / 60);
    var sec = totalSec % 60;
    return String(min) + ':' + String(sec).padStart(2, '0');
  }

  function iceClass(ms) {
    if (ms <= 0) return 'expired';
    if (ms <= ORANGE_MS) return 'warn';
    return 'ok';
  }

  function iceMarkup() {
    var timers = (state.iceTimers || []).filter(function (timer) { return !timer.dismissed; });
    if (!timers.length) return '<div class="muted">No blood on the bench.</div>';
    return timers.map(function (timer) {
      var mouse = mouseById(timer.mouseId);
      var ms = remainingMs(timer);
      var no = mouse ? String(mouse.mouseNo) : timer.mouseId;
      var tag = mouse && mouse.tag ? mouse.tag : '';
      return '<article class="ice-card ' + iceClass(ms) + '">' +
        '<div class="ice-id"><span class="ice-no">#' + escapeHtml(no) + '</span>' +
        (tag ? '<span class="ice-tag">' + escapeHtml(tag) + '</span>' : '') + '</div>' +
        '<div class="time">' + formatCountdown(ms) + '</div>' +
        '<button type="button" class="ice-dismiss" data-action="ice-dismiss" data-mouse-id="' +
        escapeHtml(timer.mouseId) + '">Moved to Ice</button></article>';
    }).join('');
  }

  function renderIce() {
    if (!state) return;
    var html = iceMarkup();
    if (el.iceList) el.iceList.innerHTML = html;
    if (el.completeIce && el.completeScreen && !el.completeScreen.classList.contains('hidden')) {
      el.completeIce.innerHTML = html;
    }
  }

  function dragHandleHtml() {
    return '<span class="drag-handle" title="גרור לשיבוץ או העברת תחנה" aria-label="גרור לשיבוץ או העברת תחנה">⠿</span>';
  }

  function routeMenuHtml(mouseId, slot) {
    var html = '<select class="station-route" data-mouse-id="' + escapeHtml(mouseId) + '" aria-label="תחנה" title="תחנה">';
    html += '<option value="queue"' + (slot < 0 ? ' selected' : '') + '>המתנה</option>';
    var i;
    for (i = 0; i < stationCount(); i++) {
      html += '<option value="' + i + '"' + (slot === i ? ' selected' : '') + '>תחנה ' + (i + 1) + '</option>';
    }
    html += '</select>';
    return html;
  }

  function renderQueue() {
    var hint = '<div class="drop-hint">שחרר להחזרה להמתנה</div>';
    var ids = state.queueOrder || [];
    if (!ids.length) {
      el.queueList.innerHTML = hint + '<div class="muted">Queue empty.</div>';
      return;
    }
    el.queueList.innerHTML = hint + ids.map(function (id) {
      var mouse = mouseById(id);
      if (!mouse) return '';
      return '<article class="queue-item" draggable="false" data-mouse-id="' + escapeHtml(id) + '">' +
        dragHandleHtml() + routeMenuHtml(id, -1) +
        '<button type="button" class="queue-main" data-action="queue-select" data-mouse-id="' +
        escapeHtml(id) + '"><span class="queue-no">#' + escapeHtml(mouse.mouseNo) + '</span>' +
        '<span class="queue-tag">' + escapeHtml(mouse.tag || '') + '</span>' +
        '<span class="queue-meta">' + escapeHtml(mouse.pyrat || '') +
        (mouse.genotype ? ' · ' + escapeHtml(mouse.genotype) : '') +
        '</span></button></article>';
    }).join('');
  }

  function renderStations() {
    el.stations.className = 'stations n-' + stationCount();
    var html = '';
    for (var i = 0; i < stationCount(); i++) {
      var id = state.stationSlots[i];
      var assign = studentSelectHtml(i);
      var mouse = id ? mouseById(id) : null;
      var hint = mouse
        ? 'שחרר להחלפה עם תחנה ' + (i + 1)
        : 'שחרר לשיבוץ בתחנה ' + (i + 1);
      html += '<div class="station-slot" data-drop-slot="' + i + '">' + assign;
      if (!mouse) {
        html += '<div class="station-empty"><span class="empty-rest">Tap a mouse from the queue</span>' +
          '<span class="drop-hint">' + hint + '</span></div>';
      } else {
        html += '<div class="drop-hint">' + hint + '</div>' + stationCardHtml(mouse, i);
      }
      html += '</div>';
    }
    el.stations.innerHTML = html;
    bindStationInputs();
  }

  function namesForChip(name) {
    if (name === 'Brain') return ['Brain'].concat(BRAIN_PARTS);
    return [name];
  }

  function readOrgan(mouse, name) {
    var value = mouse && mouse.organs ? mouse.organs[name] : null;
    if (!value) return { missing: false, pfa: false };
    if (typeof value !== 'object') {
      return { missing: value === 'missing', pfa: value === 'pfa' };
    }
    return { missing: !!value.missing, pfa: !!value.pfa };
  }

  function ensureOrgan(mouse, name) {
    if (!mouse.organs) mouse.organs = {};
    var current = readOrgan(mouse, name);
    mouse.organs[name] = current;
    return current;
  }

  function chipVisual(mouse, name) {
    var names = namesForChip(name);
    var missing = false;
    var path = false;
    var swap = false;
    names.forEach(function (organName) {
      var organ = readOrgan(mouse, organName);
      if (organ.missing) missing = true;
      if (organ.pfa) path = true;
      (mouse.pathology || []).forEach(function (item) {
        if (item.organ !== organName) return;
        path = true;
      });
      (mouse.internalSwaps || []).forEach(function (swapItem) {
        if (swapItem.a === organName || swapItem.b === organName) swap = true;
      });
      (mouse.crossSwaps || []).forEach(function (swapItem) {
        if (swapItem.tissue === organName) swap = true;
      });
    });
    return {
      missing: missing,
      path: path,
      swap: swap,
      selected: (mouse.selectedOrgans || []).indexOf(name) >= 0
    };
  }

  function stationCardHtml(mouse, slot) {
    var chips = ((state.source && state.source.chips) || []).map(function (name) {
      var vis = chipVisual(mouse, name);
      var cls = 'chip';
      if (vis.selected) cls += ' is-selected';
      if (vis.missing) cls += ' is-missing';
      if (vis.path) cls += ' is-path';
      if (vis.swap) cls += ' is-swap';
      var dots = '';
      if (vis.missing) dots += '<i class="dot dot-missing"></i>';
      if (vis.path) dots += '<i class="dot dot-path"></i>';
      if (vis.swap) dots += '<i class="dot dot-swap"></i>';
      return '<button type="button" class="' + cls + '" data-chip="' + escapeHtml(name) +
        '" data-mouse-id="' + escapeHtml(mouse.id) + '"><span class="chip-name">' + escapeHtml(name) +
        '</span>' + (dots ? '<span class="dots">' + dots + '</span>' : '') + '</button>';
    }).join('');

    var sacCtl = mouse.sacTime
      ? '<button type="button" class="stamp stamp-sac" data-action="sac" data-mouse-id="' +
        escapeHtml(mouse.id) + '" title="Click to restamp"><span class="stamp-label">Sacrificed</span>' +
        '<span class="stamp-time">' + escapeHtml(mouse.sacTime) + '</span></button>'
      : '<button type="button" class="btn btn-sac" data-action="sac" data-mouse-id="' +
        escapeHtml(mouse.id) + '">Sacrifice Now</button>';

    var bloodCtl = '';
    if (hasBloodColumn()) {
      if (mouse.bloodTime && mouse.bloodTime !== 'N/A') {
        bloodCtl = '<button type="button" class="stamp stamp-blood" data-action="blood" data-mouse-id="' +
          escapeHtml(mouse.id) + '" title="Click to restamp"><span class="stamp-label">Blood</span>' +
          '<span class="stamp-time">' + escapeHtml(mouse.bloodTime) + '</span></button>';
      } else if (!mouse.sacTime) {
        bloodCtl = '<button type="button" class="btn btn-blood is-locked" disabled data-action="blood" data-mouse-id="' +
          escapeHtml(mouse.id) + '">Blood Drawn</button>';
      } else {
        bloodCtl = '<button type="button" class="btn btn-blood" data-action="blood" data-mouse-id="' +
          escapeHtml(mouse.id) + '">Blood Drawn</button>';
      }
    }

    var selectedCount = (mouse.selectedOrgans || []).length;
    var toolDis = selectedCount ? '' : ' disabled';

    return '<article class="station-card" draggable="false" data-slot="' + slot + '" data-mouse-id="' + escapeHtml(mouse.id) + '">' +
      '<div class="card-move">' + dragHandleHtml() + routeMenuHtml(mouse.id, slot) + '</div>' +
      '<header class="station-id">' +
      '<div>' +
      '<div class="station-id-top">' +
      '<span class="station-no">#' + escapeHtml(mouse.mouseNo) + '</span>' +
      (mouse.sex ? '<span class="station-sex">' + escapeHtml(mouse.sex) + '</span>' : '') +
      '</div>' +
      '<div class="station-facts">' +
      '<span class="fact"><span class="label">Cage</span><span class="value">' + escapeHtml(mouse.cage || '—') + '</span></span>' +
      '<span class="fact"><span class="label">Ear tag</span><span class="value">' + escapeHtml(mouse.tag || '—') + '</span></span>' +
      '</div>' +
      '</div>' +
      '<div class="station-badges">' +
      '<div class="station-pyrat"><span class="label">PyRat</span><span class="value">' +
      escapeHtml(mouse.pyrat || '—') + '</span></div>' +
      (mouse.genotype ? '<span class="geno-label">' + escapeHtml(mouse.genotype) + '</span>' : '') +
      '</div>' +
      '</header>' +
      '<div class="station-times' + (hasBloodColumn() ? '' : ' times-one') + '">' + sacCtl + bloodCtl + '</div>' +
      weightFieldsHtml(mouse) +
      '<button type="button" class="btn btn-missing" data-action="missing" data-mouse-id="' +
      escapeHtml(mouse.id) + '">Missing / Dead</button>' +
      '<section class="anatomy">' +
      '<h3>Anatomy exceptions</h3>' +
      '<div class="chip-grid">' + chips + '</div>' +
      '</section>' +
      '<div class="station-tools">' +
      '<button type="button" class="btn btn-tool" data-action="mark-missing" data-mouse-id="' + escapeHtml(mouse.id) +
      '"' + toolDis + '>Mark Missing</button>' +
      '<button type="button" class="btn btn-tool" data-action="swap-internal" data-mouse-id="' + escapeHtml(mouse.id) +
      '"' + toolDis + '>Internal Swap</button>' +
      '<button type="button" class="btn btn-tool" data-action="swap-cross" data-mouse-id="' + escapeHtml(mouse.id) +
      '"' + toolDis + '>Cross Swap</button>' +
      '<button type="button" class="btn btn-tool" data-action="pathology" data-mouse-id="' + escapeHtml(mouse.id) +
      '"' + toolDis + '>Pathology / PFA</button>' +
      '</div>' +
      '<label class="mouse-notes"><span class="label">General notes</span>' +
      '<textarea data-general-notes="1" data-mouse-id="' + escapeHtml(mouse.id) + '">' +
      escapeHtml(mouse.generalNotes || '') + '</textarea></label>' +
      '<button type="button" class="btn btn-primary btn-next" data-action="save-next" data-mouse-id="' +
      escapeHtml(mouse.id) + '">Save &amp; Next Mouse</button>' +
      '</article>';
  }

  function weightFieldsHtml(mouse) {
    var fields = (state.source && state.source.weightFields) || [];
    if (!fields.length) return '';
    return '<div class="weight-row">' + fields.map(function (field) {
      var raw = mouse.weights && mouse.weights[field.key] != null ? String(mouse.weights[field.key]) : '';
      var draft = weightDraft(raw);
      var cls = 'weight-field';
      if (draft.invalid) cls += ' is-invalid';
      if (draft.value && weightWarn(field, draft.value)) cls += ' is-warn';
      return '<label class="' + cls + '"><span class="label">' + escapeHtml(field.label) + '</span>' +
        '<input type="text" inputmode="decimal" autocomplete="off" data-weight-key="' + escapeHtml(field.key) +
        '" data-mouse-id="' + escapeHtml(mouse.id) + '" value="' + escapeHtml(raw) + '">' +
        '<span class="unit">' + escapeHtml(field.unit || 'g') + '</span></label>';
    }).join('') + '</div>';
  }

  function ensureStudentList_(students) {
    var list = document.getElementById('station-student-list');
    if (!list) {
      list = document.createElement('datalist');
      list.id = 'station-student-list';
      document.body.appendChild(list);
    }
    var seen = {};
    var html = '';
    (students || []).forEach(function (name) {
      var text = String(name || '').trim();
      if (!text || seen[text]) return;
      seen[text] = true;
      html += '<option value="' + escapeHtml(text) + '"></option>';
    });
    list.innerHTML = html;
  }

  function studentSelectHtml(slot) {
    var selected = (state.stationStudents && state.stationStudents[slot]) || '';
    var students = (state.source && state.source.students) || [];
    ensureStudentList_(students);
    return '<label class="station-student"><span class="label">Station ' + (slot + 1) + '</span>' +
      '<input type="text" autocomplete="off" placeholder="Type a name" data-station-slot="' + slot +
      '" list="station-student-list" value="' + escapeHtml(selected) + '"></label>';
  }

  function bindStationInputs() {
    el.stations.querySelectorAll('[data-station-slot]').forEach(function (input) {
      input.addEventListener('input', onStationStudent);
      input.addEventListener('change', onStationStudent);
      input.addEventListener('click', function (event) { event.stopPropagation(); });
    });
    el.stations.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', onChipClick);
    });
    el.stations.querySelectorAll('[data-weight-key]').forEach(function (input) {
      input.addEventListener('input', onWeightInput);
      input.addEventListener('click', function (event) { event.stopPropagation(); });
    });
    el.stations.querySelectorAll('[data-general-notes]').forEach(function (input) {
      input.addEventListener('input', onNotesInput);
      input.addEventListener('click', function (event) { event.stopPropagation(); });
    });
  }

  function onStationStudent(event) {
    var slot = Number(event.target.getAttribute('data-station-slot'));
    if (!state.stationStudents) state.stationStudents = [];
    state.stationStudents[slot] = event.target.value;
    var mouseId = state.stationSlots[slot];
    var mouse = mouseId ? mouseById(mouseId) : null;
    if (mouse && mouse.status === 'active') mouse.student = event.target.value;
    persist();
  }

  function onChipClick(event) {
    var mouseId = event.currentTarget.getAttribute('data-mouse-id');
    var organ = event.currentTarget.getAttribute('data-chip');
    toggleSelected(mouseId, organ);
  }

  function toggleSelected(mouseId, organ) {
    var mouse = mouseById(mouseId);
    if (!mouse || !organ) return;
    if (!Array.isArray(mouse.selectedOrgans)) mouse.selectedOrgans = [];
    var index = mouse.selectedOrgans.indexOf(organ);
    if (index >= 0) mouse.selectedOrgans.splice(index, 1);
    else mouse.selectedOrgans.push(organ);
    persist();
    renderStations();
  }

  function selectedOrgans(mouse) {
    return mouse && Array.isArray(mouse.selectedOrgans) ? mouse.selectedOrgans.slice() : [];
  }

  function requireSelection(mouse) {
    var selected = selectedOrgans(mouse);
    if (!selected.length) {
      el.syncStatus.textContent = 'Select one or more organs first.';
      return null;
    }
    return selected;
  }

  function onAppClick(event) {
    var btn = event.target.closest('[data-action]');
    if (!btn || !state) return;
    if (btn.disabled) return;
    var action = btn.getAttribute('data-action');
    var mouseId = btn.getAttribute('data-mouse-id');
    if (action === 'queue-select') selectFromQueue(mouseId);
    else if (action === 'ice-dismiss') dismissIce(mouseId);
    else if (action === 'sac') stampSac(mouseId);
    else if (action === 'blood') stampBlood(mouseId);
    else if (action === 'missing') markMissing(mouseId);
    else if (action === 'save-next') saveAndNext(mouseId);
    else if (action === 'mark-missing') markOrgansMissing(mouseId);
    else if (action === 'swap-internal') openInternalSwap(mouseId);
    else if (action === 'swap-cross') openCrossSwap(mouseId);
    else if (action === 'pathology') openPathology(mouseId);
    else if (action === 'view-sheet') openSyncedSheet();
  }

  function firstEmptySlot() {
    for (var i = 0; i < stationCount(); i++) {
      if (!state.stationSlots[i]) return i;
    }
    return -1;
  }

  function slotOfMouse(mouseId) {
    for (var i = 0; i < stationCount(); i++) {
      if (String(state.stationSlots[i]) === String(mouseId)) return i;
    }
    return -1;
  }

  function selectFromQueue(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse || mouse.status !== 'queued') return;
    var slot = firstEmptySlot();
    if (slot < 0) {
      el.syncStatus.textContent = 'All stations are full.';
      return;
    }
    routeMouse_(mouseId, { type: 'slot', index: slot });
  }

  var dragGesture = null;
  var DRAG_SLOP_PX = 8;

  function interactiveDragTarget_(target) {
    return !!(target && target.closest && target.closest('input, button, select, textarea, label'));
  }

  function onDragPointerDown(event) {
    if (!state || !sessionActive) return;
    if (event.isPrimary === false) return;
    if (event.button != null && event.button !== 0) return;
    var target = event.target;
    if (!target || !target.closest) return;
    if (interactiveDragTarget_(target)) return;
    var handle = target.closest('.drag-handle');
    if (!handle) return;
    var card = handle.closest('[data-mouse-id]');
    if (!card) return;
    card.setAttribute('draggable', 'true');
    if (event.cancelable) event.preventDefault();
    dragGesture = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      card: card,
      mouseId: card.getAttribute('data-mouse-id'),
      armed: false
    };
    try { handle.setPointerCapture(event.pointerId); } catch (err) {}
  }

  function onDragPointerMove(event) {
    if (!dragGesture || event.pointerId !== dragGesture.pointerId) return;
    var dx = event.clientX - dragGesture.startX;
    var dy = event.clientY - dragGesture.startY;
    if (!dragGesture.armed) {
      if (Math.sqrt(dx * dx + dy * dy) < DRAG_SLOP_PX) return;
      dragGesture.armed = true;
      dragGesture.card.classList.add('is-drag-source');
      document.body.classList.add('is-mouse-drag');
    }
    if (event.cancelable) event.preventDefault();
    highlightDrop_(event.clientX, event.clientY);
  }

  function onDragPointerUp(event) {
    finishDrag_(event, true);
  }

  function onDragPointerCancel(event) {
    finishDrag_(event, false);
  }

  function finishDrag_(event, commit) {
    if (!dragGesture) return;
    if (event && event.pointerId != null && event.pointerId !== dragGesture.pointerId) return;
    var gesture = dragGesture;
    dragGesture = null;
    releaseDragAttribute_();
    if (gesture.card) gesture.card.classList.remove('is-drag-source');
    document.body.classList.remove('is-mouse-drag');
    clearDropOver_();
    if (!commit || !gesture.armed) return;
    var zone = dropZoneAt_(event.clientX, event.clientY);
    if (!zone) return;
    routeMouse_(gesture.mouseId, zone);
  }

  function releaseDragAttribute_() {
    document.querySelectorAll('[data-mouse-id][draggable="true"]').forEach(function (card) {
      card.setAttribute('draggable', 'false');
    });
  }

  function onCardDragStart(event) {
    var card = event.target && event.target.closest ? event.target.closest('[data-mouse-id]') : null;
    if (!card || card.getAttribute('draggable') !== 'true') return;
    event.preventDefault();
    if (!dragGesture || !dragGesture.armed) card.setAttribute('draggable', 'false');
  }

  function highlightDrop_(x, y) {
    clearDropOver_();
    var zone = dropZoneAt_(x, y);
    if (!zone) return;
    var node = zone.type === 'queue'
      ? el.queueList
      : el.stations.querySelector('[data-drop-slot="' + zone.index + '"]');
    if (node) node.classList.add('is-drop-over');
  }

  function clearDropOver_() {
    document.querySelectorAll('.is-drop-over').forEach(function (node) {
      node.classList.remove('is-drop-over');
    });
  }

  function dropZoneAt_(x, y) {
    var stack = document.elementsFromPoint(x, y);
    var i;
    for (i = 0; i < stack.length; i++) {
      var node = stack[i];
      if (!node || !node.closest) continue;
      if (node.closest('.is-drag-source')) continue;
      var slot = node.closest('[data-drop-slot]');
      if (slot && el.stations && el.stations.contains(slot)) {
        return { type: 'slot', index: Number(slot.getAttribute('data-drop-slot')) };
      }
      if (node.closest('[data-drop-queue]')) return { type: 'queue' };
    }
    return null;
  }

  function onStationRouteChange(event) {
    var sel = event.target && event.target.closest ? event.target.closest('.station-route') : null;
    if (!sel || !state || !sessionActive) return;
    var mouseId = sel.getAttribute('data-mouse-id');
    if (sel.value === 'queue') routeMouse_(mouseId, { type: 'queue' });
    else routeMouse_(mouseId, { type: 'slot', index: Number(sel.value) });
  }

  function queueHas_(mouseId) {
    return (state.queueOrder || []).some(function (id) { return String(id) === String(mouseId); });
  }

  function takeQueue_(mouseId) {
    state.queueOrder = (state.queueOrder || []).filter(function (id) {
      return String(id) !== String(mouseId);
    });
  }

  function routeMouse_(mouseId, dest) {
    if (!state || !dest) return false;
    var mouse = mouseById(mouseId);
    if (!mouse || mouse.status === 'done' || mouse.status === 'missing') return false;
    var fromSlot = slotOfMouse(mouseId);
    var fromQueue = fromSlot < 0 && queueHas_(mouseId);
    if (fromSlot < 0 && !fromQueue) return false;
    if (dest.type === 'queue') {
      if (fromSlot < 0) return false;
      state.stationSlots[fromSlot] = null;
      mouse.status = 'queued';
      takeQueue_(mouseId);
      state.queueOrder.unshift(String(mouse.id));
      persist();
      renderAll();
      return true;
    }
    var to = Number(dest.index);
    if (!(to >= 0) || to >= stationCount() || fromSlot === to) return false;
    var occupantId = state.stationSlots[to] ? String(state.stationSlots[to]) : '';
    if (fromSlot >= 0) state.stationSlots[fromSlot] = null;
    else takeQueue_(mouseId);
    if (occupantId && occupantId !== String(mouse.id)) {
      var occupant = mouseById(occupantId);
      if (fromSlot >= 0) {
        state.stationSlots[fromSlot] = occupantId;
        if (occupant && occupant.status !== 'done' && occupant.status !== 'missing') {
          occupant.status = 'active';
          occupant.student = (state.stationStudents && state.stationStudents[fromSlot]) || '';
        }
      } else if (occupant && occupant.status !== 'done' && occupant.status !== 'missing') {
        occupant.status = 'queued';
        takeQueue_(occupantId);
        state.queueOrder.unshift(occupantId);
      }
    }
    state.stationSlots[to] = String(mouse.id);
    mouse.status = 'active';
    mouse.student = (state.stationStudents && state.stationStudents[to]) || '';
    takeQueue_(mouse.id);
    persist();
    renderAll();
    return true;
  }

  function syncStationIndexes_() {
    var seen = {};
    var i;
    for (i = 0; i < stationCount(); i++) {
      var id = state.stationSlots[i] ? String(state.stationSlots[i]) : '';
      var mouse = id ? state.miceById[id] : null;
      if (!id || !mouse || seen[id] || mouse.status === 'done' || mouse.status === 'missing') {
        state.stationSlots[i] = null;
        if (mouse && (mouse.status === 'done' || mouse.status === 'missing')) mouse.stationIndex = null;
        continue;
      }
      seen[id] = true;
      mouse.status = 'active';
      mouse.stationIndex = i;
      state.stationSlots[i] = id;
    }
    var queue = [];
    (state.queueOrder || []).forEach(function (raw) {
      var qid = String(raw);
      var queued = state.miceById[qid];
      if (!queued || seen[qid] || queue.indexOf(qid) >= 0) return;
      if (queued.status === 'done' || queued.status === 'missing') {
        queued.stationIndex = null;
        return;
      }
      queued.status = 'queued';
      queued.stationIndex = null;
      queue.push(qid);
      seen[qid] = true;
    });
    Object.keys(state.miceById || {}).forEach(function (id) {
      if (seen[id]) return;
      var extra = state.miceById[id];
      if (!extra || extra.status === 'done' || extra.status === 'missing') {
        if (extra) extra.stationIndex = null;
        return;
      }
      extra.status = 'queued';
      extra.stationIndex = null;
      queue.push(String(id));
      seen[id] = true;
    });
    state.queueOrder = queue;
  }

  function pullNextInto(slot) {
    var nextId = state.queueOrder.length ? state.queueOrder[0] : null;
    if (!nextId) {
      state.stationSlots[slot] = null;
      return;
    }
    state.queueOrder = state.queueOrder.slice(1);
    var mouse = mouseById(nextId);
    if (mouse) {
      mouse.status = 'active';
      mouse.student = state.stationStudents[slot] || '';
    }
    state.stationSlots[slot] = String(nextId);
  }

  function stampNow() {
    var d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function stampSac(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    mouse.sacTime = stampNow();
    persist();
    renderStations();
  }

  function stampBlood(mouseId) {
    var mouse = mouseById(mouseId);
    if (!hasBloodColumn() || !mouse || !mouse.sacTime) return;
    mouse.bloodTime = stampNow();
    var existing = state.iceTimers.filter(function (timer) {
      return String(timer.mouseId) === String(mouseId) && !timer.dismissed;
    })[0];
    if (!existing) {
      state.iceTimers.push({
        mouseId: String(mouseId),
        startedAtMs: Date.now(),
        dismissed: false,
        expiredAlerted: false
      });
    }
    persist();
    renderAll();
  }

  function dismissIce(mouseId) {
    state.iceTimers.forEach(function (timer) {
      if (String(timer.mouseId) === String(mouseId) && !timer.dismissed) {
        timer.dismissed = true;
      }
    });
    persist();
    renderIce();
  }

  function markOrgansMissing(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    var selected = requireSelection(mouse);
    if (!selected) return;
    selected.forEach(function (name) {
      var organ = ensureOrgan(mouse, name);
      organ.missing = !organ.missing;
    });
    mouse.selectedOrgans = [];
    persist();
    renderStations();
  }

  function markMissing(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    archiveMouse(mouse, 'missing');
    var slot = slotOfMouse(mouseId);
    if (slot >= 0) pullNextInto(slot);
    persist();
    renderAll();
  }

  function saveAndNext(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    if (hasBloodColumn() && !mouse.bloodTime) mouse.bloodTime = 'N/A';
    archiveMouse(mouse, 'done');
    var slot = slotOfMouse(mouseId);
    if (slot >= 0) pullNextInto(slot);
    persist();
    renderAll();
  }

  function archiveMouse(mouse, status) {
    mouse.status = status;
    mouse.selectedOrgans = [];
    mouse.notes = generateNotes(mouse);
  }

  function organOptions() {
    return ((state.source && state.source.modalOrgans) || (state.source && state.source.chips) || []).slice();
  }

  function openInternalSwap(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    var selected = requireSelection(mouse);
    if (!selected) return;
    if (selected.length === 2) {
      if (!applyInternalSwap(mouse, selected[0], selected[1])) return;
      mouse.selectedOrgans = [];
      persist();
      renderStations();
      return;
    }
    var opts = organSelectHtml(organOptions(), 'organA') + organSelectHtml(organOptions(), 'organB');
    openModal('Internal Swap — #' + mouse.mouseNo, opts, { type: 'internal', mouseId: mouseId });
  }

  function applyInternalSwap(mouse, organA, organB) {
    if (!organA || !organB || organA === organB) {
      el.syncStatus.textContent = 'Pick two different organs.';
      return false;
    }
    mouse.internalSwaps.push({ a: organA, b: organB });
    return true;
  }

  function openCrossSwap(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    var selected = requireSelection(mouse);
    if (!selected) return;
    var others = allMice().filter(function (item) { return String(item.id) !== String(mouseId); });
    var mouseOpts = others.map(function (item) {
      return '<option value="' + escapeHtml(item.id) + '">#' + escapeHtml(item.mouseNo) +
        (item.tag ? ' ' + escapeHtml(item.tag) : '') + '</option>';
    }).join('');
    var body = '<p class="field">Tissues: ' + escapeHtml(selected.join(', ')) + '</p>' +
      '<label class="field">Other mouse<select id="otherMouse">' + mouseOpts + '</select></label>';
    openModal('Cross-Mouse Swap — #' + mouse.mouseNo, body, {
      type: 'cross',
      mouseId: mouseId,
      organs: selected
    });
  }

  function openPathology(mouseId) {
    var mouse = mouseById(mouseId);
    if (!mouse) return;
    var selected = requireSelection(mouse);
    if (!selected) return;
    var tags = PATHOLOGY_TAGS.map(function (tag) {
      return '<button type="button" class="tag-btn" data-tag="' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</button>';
    }).join('');
    var body = '<p class="field">Organs: ' + escapeHtml(selected.join(', ')) + '</p>' +
      '<div class="tag-row">' + tags + '</div>' +
      '<label class="field">Observation<input type="text" id="pathText" autocomplete="off"></label>' +
      '<label class="check"><input type="checkbox" id="pathPfa"> Sent to PFA</label>';
    openModal('Pathology / PFA — #' + mouse.mouseNo, body, {
      type: 'pathology',
      mouseId: mouseId,
      organs: selected
    });
  }

  function organSelectHtml(organs, id) {
    var opts = organs.map(function (name) {
      return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
    }).join('');
    return '<label class="field">' + (id === 'organB' ? 'Organ B' : (id === 'organA' ? 'Organ A' : 'Organ')) +
      '<select id="' + id + '">' + opts + '</select></label>';
  }

  function openModal(title, body, context) {
    modalContext = context;
    el.modalTitle.textContent = title;
    el.modalBody.innerHTML = body;
    el.modalBody.querySelectorAll('.tag-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.classList.toggle('is-on');
      });
    });
    el.modalRoot.classList.remove('hidden');
    el.modalRoot.setAttribute('aria-hidden', 'false');
  }

  function closeModal() {
    modalContext = null;
    el.modalRoot.classList.add('hidden');
    el.modalRoot.setAttribute('aria-hidden', 'true');
    el.modalBody.innerHTML = '';
  }

  function saveModal() {
    if (!modalContext) return;
    var mouse = mouseById(modalContext.mouseId);
    if (!mouse) {
      closeModal();
      return;
    }
    if (modalContext.type === 'internal') {
      if (!applyInternalSwap(mouse, valueOf('organA'), valueOf('organB'))) return;
      mouse.selectedOrgans = [];
    } else if (modalContext.type === 'cross') {
      var other = mouseById(valueOf('otherMouse'));
      var tissues = modalContext.organs || [];
      if (!other || !tissues.length) {
        el.syncStatus.textContent = 'Pick another mouse.';
        return;
      }
      tissues.forEach(function (tissue) {
        mouse.crossSwaps.push({ tissue: tissue, otherMouseNo: String(other.mouseNo) });
        other.crossSwaps.push({ tissue: tissue, otherMouseNo: String(mouse.mouseNo) });
      });
      mouse.selectedOrgans = [];
    } else if (modalContext.type === 'pathology') {
      var tags = [];
      el.modalBody.querySelectorAll('.tag-btn.is-on').forEach(function (btn) {
        tags.push(btn.getAttribute('data-tag'));
      });
      var text = valueOf('pathText');
      var pfa = !!(document.getElementById('pathPfa') && document.getElementById('pathPfa').checked);
      if (!tags.length && !text && !pfa) {
        el.syncStatus.textContent = 'Add a tag, a note, or PFA.';
        return;
      }
      (modalContext.organs || []).forEach(function (organ) {
        mouse.pathology.push({ organ: organ, tags: tags.slice(), text: text, pfa: pfa });
        if (pfa) ensureOrgan(mouse, organ).pfa = true;
      });
      mouse.selectedOrgans = [];
    }
    persist();
    closeModal();
    renderAll();
  }

  function valueOf(id) {
    var node = document.getElementById(id);
    return node ? String(node.value || '').trim() : '';
  }

  function weightFieldByKey(key) {
    var fields = (state.source && state.source.weightFields) || [];
    for (var i = 0; i < fields.length; i++) {
      if (fields[i].key === key) return fields[i];
    }
    return null;
  }

  function weightDraft(raw) {
    var text = String(raw || '').trim().replace(',', '.');
    if (!text) return { empty: true };
    if (/^\d+\.$/.test(text)) return { draft: true };
    if (!/^\d+(\.\d+)?$/.test(text)) return { invalid: true };
    return { value: text };
  }

  function canonicalWeight(raw) {
    var draft = weightDraft(raw);
    return draft.value || '';
  }

  function weightWarn(field, canonical) {
    if (!field || !canonical) return false;
    var num = Number(canonical);
    if (!isFinite(num)) return false;
    if (field.min != null && field.min !== '' && num < Number(field.min)) return true;
    if (field.max != null && field.max !== '' && num > Number(field.max)) return true;
    return false;
  }

  function onWeightInput(event) {
    var input = event.target;
    var mouse = mouseById(input.getAttribute('data-mouse-id'));
    var key = input.getAttribute('data-weight-key');
    if (!mouse || !key) return;
    if (!mouse.weights) mouse.weights = {};
    var draft = weightDraft(input.value);
    var label = input.parentElement;
    var field = weightFieldByKey(key);
    label.classList.remove('is-invalid', 'is-warn');
    if (draft.empty) {
      mouse.weights[key] = '';
      persist();
      return;
    }
    if (draft.invalid) {
      label.classList.add('is-invalid');
      return;
    }
    if (draft.draft) return;
    mouse.weights[key] = draft.value;
    if (weightWarn(field, draft.value)) label.classList.add('is-warn');
    persist();
  }

  function onNotesInput(event) {
    var mouse = mouseById(event.target.getAttribute('data-mouse-id'));
    if (!mouse) return;
    mouse.generalNotes = event.target.value;
    if (notesTimer) clearTimeout(notesTimer);
    notesTimer = setTimeout(function () {
      notesTimer = null;
      persist();
    }, NOTES_DEBOUNCE_MS);
  }

  function displayOrgan(name) {
    if (name === 'L-liver' || name === 'L-Liver') return 'Left Liver';
    return name;
  }

  function hasPathology(mouse, name) {
    return (mouse.pathology || []).some(function (item) { return item.organ === name; });
  }

  function organNoteParts(mouse) {
    var parts = [];
    var organs = mouse.organs || {};
    Object.keys(organs).forEach(function (name) {
      if (readOrgan(mouse, name).missing) parts.push(displayOrgan(name) + ': Missing');
    });
    (mouse.pathology || []).forEach(function (item) {
      var bits = (item.tags || []).map(function (tag) { return String(tag).toLowerCase(); });
      if (item.text) bits.push(String(item.text).trim());
      var detail = bits.filter(Boolean).join(', ');
      var clause = displayOrgan(item.organ) + ': Pathology' + (detail ? ' (' + detail + ')' : '');
      if (item.pfa) clause += ', PFA';
      parts.push(clause);
    });
    Object.keys(organs).forEach(function (name) {
      if (readOrgan(mouse, name).pfa && !hasPathology(mouse, name)) {
        parts.push(displayOrgan(name) + ': PFA');
      }
    });
    (mouse.internalSwaps || []).forEach(function (swapItem) {
      parts.push(displayOrgan(swapItem.a) + ': Internal swap with ' + displayOrgan(swapItem.b));
    });
    (mouse.crossSwaps || []).forEach(function (swapItem) {
      parts.push(displayOrgan(swapItem.tissue) + ': Cross swap with #' + swapItem.otherMouseNo);
    });
    return parts;
  }

  function generateNotes(mouse) {
    if (!mouse) return '';
    var parts = [];
    if (mouse.status === 'missing') parts.push('Missing/Dead');
    organNoteParts(mouse).forEach(function (part) { parts.push(part); });
    var general = String(mouse.generalNotes || '').trim();
    if (general) parts.push(general);
    return parts.join('; ');
  }

  function exportFields(mouse) {
    var missing = [];
    var pfa = [];
    var organs = mouse.organs || {};
    Object.keys(organs).forEach(function (name) {
      var organ = readOrgan(mouse, name);
      if (organ.missing) missing.push(name);
      if (organ.pfa) pfa.push(name);
    });
    (mouse.pathology || []).forEach(function (item) {
      if (item.pfa && pfa.indexOf(item.organ) < 0) pfa.push(item.organ);
    });
    var pathologyText = (mouse.pathology || []).map(function (item) {
      var bits = (item.tags || []).slice();
      if (item.text) bits.push(item.text);
      return item.organ + ': ' + bits.join(', ');
    }).join('; ');
    return {
      mouseNo: String(mouse.mouseNo),
      sheetRow: mouse.sheetRow || null,
      student: mouse.student || '',
      sacTime: mouse.sacTime || '',
      bloodTime: mouse.bloodTime || '',
      status: mouse.status || '',
      notes: isTerminal(mouse) ? generateNotes(mouse) : '',
      weights: mouse.weights || {},
      generalNotes: mouse.generalNotes || '',
      cells: mouse.cells || {},
      missingOrgans: missing,
      pfaOrgans: pfa,
      pathologyOrgans: (mouse.pathology || []).map(function (item) { return item.organ; }),
      pathologyTypes: (mouse.pathology || []).map(function (item) {
        return (item.tags || []).join(', ');
      }),
      pathologyText: pathologyText,
      crossSwaps: (mouse.crossSwaps || []).map(function (swapItem) {
        return swapItem.tissue + ' with #' + swapItem.otherMouseNo;
      }),
      internalSwaps: (mouse.internalSwaps || []).map(function (swapItem) {
        return swapItem.a + ' with ' + swapItem.b;
      })
    };
  }

  function buildPayload() {
    return {
      sourceFileId: state.source.fileId,
      spreadsheetId: state.source.fileId || pipeline.spreadsheetId || '',
      sourceFileName: state.source.fileName,
      folderId: (state.source && state.source.projectFolderId) || pipeline.folderId || '',
      sig: pipeline.sig || '',
      exportFileId: state.exportFileId || '',
      exportUrl: state.exportUrl || '',
      exportFileName: state.exportFileName || '',
      meta: state.source.meta || {},
      mice: allMice().map(exportFields)
    };
  }

  function downloadJsonBackup() {
    if (!state) return;
    var blob = new Blob([JSON.stringify(buildPayload(), null, 2)], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dissection-session.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function onSync(opts) {
    opts = opts || {};
    if (!state || syncing) return;
    if (!opts.auto) {
      var leftover = (state.queueOrder || []).length + state.stationSlots.filter(Boolean).length;
      if (leftover && !confirm('Some mice are not archived yet. Export anyway?')) return;
    }
    syncing = true;
    el.syncStatus.textContent = 'Uploading…';
    el.btnSync.disabled = true;
    renderComplete();
    var payload = buildPayload();
    gasRun('saveSessionData', payload).then(function (result) {
      syncing = false;
      state.exported = true;
      state.lastSyncOk = true;
      if (result && result.fileId) state.exportFileId = result.fileId;
      if (result && result.url) state.exportUrl = result.url;
      if (result && result.fileName) state.exportFileName = result.fileName;
      persist();
      el.btnSync.disabled = false;
      var url = state.exportUrl || '';
      el.syncStatus.innerHTML = 'Saved' + (state.exportFileName ? ': ' + escapeHtml(state.exportFileName) : '') +
        (url ? ' · <a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Open sheet</a>' : '');
      renderComplete();
    }).catch(function (error) {
      syncing = false;
      state.lastSyncOk = false;
      persist();
      el.btnSync.disabled = false;
      el.syncStatus.textContent = (error && error.message ? error.message : 'Export failed.') +
        ' JSON backup is available.';
      renderComplete();
      if (!opts.auto) downloadJsonBackup();
    });
  }

  function renderComplete() {
    if (!el.completeScreen) return;
    if (!state || !sessionComplete()) {
      el.completeScreen.classList.add('hidden');
      el.completeScreen.setAttribute('aria-hidden', 'true');
      return;
    }
    el.completeScreen.classList.remove('hidden');
    el.completeScreen.setAttribute('aria-hidden', 'false');
    var iceBlock = el.completeScreen.querySelector('.complete-ice');
    if (iceBlock) iceBlock.classList.toggle('hidden', !hasBloodColumn());
    var mice = allMice();
    var done = mice.filter(function (mouse) { return mouse.status === 'done'; }).length;
    var missing = mice.filter(function (mouse) { return mouse.status === 'missing'; }).length;
    var endMs = state.completedAtMs || Date.now();
    var startMs = state.startedAtMs || endMs;
    if (el.completeMetrics) {
      el.completeMetrics.innerHTML =
        metricHtml('Completed', String(done)) +
        metricHtml('Missing', String(missing)) +
        metricHtml('Duration', formatDuration(endMs - startMs)) +
        metricHtml('Sac times', sacRange());
    }
    var cloud = 'Cloud sync pending';
    var badge = '';
    if (syncing) cloud = 'Cloud sync in progress';
    else if (state.lastSyncOk === true) {
      cloud = 'Cloud sync verified';
      badge = ' is-ok';
    } else if (state.lastSyncOk === false) {
      cloud = 'Cloud sync failed';
      badge = ' is-bad';
    }
    if (el.completeSync) {
      el.completeSync.className = 'sync-badge' + badge;
      el.completeSync.textContent = 'Local session saved · ' + cloud;
    }
    if (el.btnViewSheet) el.btnViewSheet.disabled = !(state.exportUrl && state.lastSyncOk === true);
    renderIce();
  }

  function metricHtml(label, value) {
    return '<div class="metric"><span class="label">' + escapeHtml(label) + '</span><span class="value">' +
      escapeHtml(value) + '</span></div>';
  }

  function formatDuration(ms) {
    var sec = Math.max(0, Math.floor(Number(ms || 0) / 1000));
    var hours = Math.floor(sec / 3600);
    var minutes = Math.floor((sec % 3600) / 60);
    var seconds = sec % 60;
    if (hours) return hours + 'h ' + minutes + 'm';
    if (minutes) return minutes + 'm ' + seconds + 's';
    return seconds + 's';
  }

  function timeToMin(text) {
    var parts = String(text || '').split(':');
    if (parts.length < 2) return null;
    var hours = Number(parts[0]);
    var minutes = Number(parts[1]);
    if (!isFinite(hours) || !isFinite(minutes)) return null;
    return hours * 60 + minutes;
  }

  function sacRange() {
    var times = allMice().map(function (mouse) { return mouse.sacTime || ''; }).filter(function (text) {
      return timeToMin(text) != null && /^\d{2}:\d{2}$/.test(text);
    });
    if (!times.length) return '—';
    times.sort(function (a, b) { return timeToMin(a) - timeToMin(b); });
    if (times[0] === times[times.length - 1]) return times[0];
    return times[0] + ' – ' + times[times.length - 1];
  }

  function openSyncedSheet() {
    if (!state || !state.exportUrl || state.lastSyncOk !== true) return;
    window.open(state.exportUrl, '_blank', 'noopener');
  }

  function startTicks() {
    stopTicks();
    tickTimer = setInterval(function () { tickIce(false); }, 1000);
  }

  function stopTicks() {
    if (tickTimer) {
      clearInterval(tickTimer);
      tickTimer = null;
    }
  }

  function tickIce(fromResume) {
    if (!state) return;
    pendingBeep = false;
    var dirty = false;
    (state.iceTimers || []).forEach(function (timer) {
      if (timer.dismissed) return;
      if (remainingMs(timer) > 0) return;
      if (timer.expiredAlerted) return;
      timer.expiredAlerted = true;
      pendingBeep = true;
      dirty = true;
    });
    if (dirty) persist();
    if (pendingBeep) playBeep();
    if (sessionActive) renderIce();
  }

  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (error) {}
  }

  function playBeep() {
    unlockAudio();
    if (audioCtx) {
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
        return;
      } catch (error) {}
    }
    try {
      var audio = new Audio(
        'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA='
      );
      audio.volume = 0.2;
      audio.play();
    } catch (error2) {}
  }

  function startWakeLock() {
    wantWakeLock = true;
    requestWakeLock();
  }

  function stopWakeLock() {
    wantWakeLock = false;
    if (wakeLockSentinel) {
      try { wakeLockSentinel.release(); } catch (error) {}
      wakeLockSentinel = null;
    }
  }

  function requestWakeLock() {
    if (!wantWakeLock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (sentinel) {
      wakeLockSentinel = sentinel;
      sentinel.addEventListener('release', function () {
        if (wantWakeLock && document.visibilityState === 'visible') requestWakeLock();
      });
    }).catch(function () {});
  }

  function onVisibilityChange() {
    if (document.visibilityState === 'visible' && wantWakeLock) requestWakeLock();
  }

  function formatDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString();
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  init();
})();
</script>
