<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sacrifice Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
  :root {
    --background: #121217;
    --card-background: #1e1e24;
    --border: #2d2d38;
    --text-primary: #e0e0e0;
    --text-secondary: #707080;
    --action-green: #2a9d6e;
    --action-green-deep: #163d30;
    --action-blue: #3498db;
    --action-blue-deep: #1a3f5c;
    --exception-pink: #b04856;
    --logged: #c4a035;
    --warn: #b8860b;
    --warn-deep: #3d2e0a;
    --expired: #5c2430;
    --touch: 44px;
    --radius: 4px;
    --bg: var(--background);
    --panel: var(--card-background);
    --panel-2: #16161c;
    --text: var(--text-primary);
    --muted: var(--text-secondary);
    --line: var(--border);
    --green: var(--action-green);
    --green-d: var(--action-green-deep);
    --red: var(--exception-pink);
    --red-d: #5c2430;
    --blue: var(--action-blue);
    --btn: #2a2a32;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--background);
    color: var(--text-primary);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    font-size: 13px;
  }

  button, select, input {
    font: inherit;
  }

  .hidden { display: none !important; }

  .overlay {
    position: fixed;
    inset: 0;
    background: var(--background);
    overflow: auto;
    z-index: 40;
    padding: 20px 12px;
  }

  .setup-card {
    max-width: 680px;
    margin: 0 auto;
    background: var(--card-background);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .setup-card h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
  .lede { color: var(--text-secondary); margin: 0 0 12px; font-size: 13px; }

  .resume-box {
    background: #2a2410;
    border: 1px solid var(--warn);
    color: #e8e0c8;
    padding: 8px 10px;
    border-radius: var(--radius);
    margin-bottom: 10px;
  }

  .resume-box .row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 55vh;
    overflow: auto;
  }

  .file-btn {
    min-height: var(--touch);
    text-align: left;
    background: var(--panel-2);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    cursor: pointer;
  }

  .file-btn:hover, .file-btn:focus { border-color: var(--action-blue); }

  .file-btn small {
    display: block;
    color: var(--text-secondary);
    margin-top: 2px;
    font-size: 11px;
  }

  .status-line {
    color: var(--text-secondary);
    margin: 0;
    min-height: 1em;
    font-size: 11px;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 1fr auto;
  }

  .topbar, .footbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px;
    background: #16161c;
    border-color: var(--border);
  }

  .topbar {
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .topbar-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .topbar-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-sheet {
    font-size: 12px;
    font-weight: 700;
    color: #8ec5ff;
    text-decoration: none;
    white-space: nowrap;
  }

  .topbar-sub {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    opacity: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    letter-spacing: -0.02em;
  }

  .progress span {
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 11px;
  }

  .footbar {
    flex-wrap: wrap;
    min-height: 38px;
    justify-content: space-between;
    border-top: 1px solid var(--border);
  }

  .foot-subdued {
    display: flex;
    gap: 4px;
  }

  .muted { color: var(--text-secondary); font-size: 12px; }

  .board {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 2.5fr minmax(180px, 0.9fr);
    gap: 4px;
    padding: 4px;
    min-height: 0;
  }

  .col {
    background: var(--card-background);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .col h2 {
    margin: 0;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
  }

  .ice-list, .queue-list, .stations {
    overflow: auto;
    padding: 4px;
    flex: 1;
    min-height: 0;
  }

  .stations {
    display: grid;
    gap: 4px;
    align-items: stretch;
    overflow: hidden;
  }

  .stations.n-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stations.n-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stations.n-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .board.no-blood {
    grid-template-columns: minmax(0, 1fr) minmax(160px, 0.72fr);
  }

  .board.no-blood .ice-col { display: none; }

  .station-slot {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
    min-width: 0;
  }

  .station-student {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .station-student .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .station-student select,
  .station-student input {
    flex: 1;
    min-height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #121217;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 0 8px;
  }

  .station-setup { margin-top: 12px; }
  .setup-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .count-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .count-btn {
    min-width: 44px;
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #1a1a20;
    color: var(--text-primary);
    font-weight: 700;
    cursor: pointer;
  }
  .count-btn.is-on {
    background: var(--action-blue);
    border-color: var(--action-blue);
    color: #fff;
  }
  .assign-list { display: grid; gap: 6px; margin-bottom: 10px; }

  .ice-card {
    color: var(--text-primary);
    margin-bottom: 4px;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 0 8px;
    padding: 8px;
    border-radius: var(--radius);
    border: 1px solid transparent;
  }

  .ice-id {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }

  .ice-no {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
  }

  .ice-tag {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.6;
    letter-spacing: 0.04em;
  }

  .ice-card .time {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .ice-dismiss {
    grid-column: 1;
    margin-top: 6px;
    min-height: 28px;
    padding: 0 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(0, 0, 0, 0.28);
    color: inherit;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius);
    cursor: pointer;
    width: max-content;
  }

  .ice-card.ok { background: #1a4a3a; }
  .ice-card.warn { background: var(--warn-deep); color: #f0d78c; }
  .ice-card.expired {
    background: var(--expired);
    animation: iceflash 1s linear infinite;
  }

  @keyframes iceflash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.62; }
  }

  .queue-list { padding: 2px 4px; }

  .queue-item {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--border);
    margin: 0;
    min-height: 36px;
    text-align: left;
    padding: 4px 4px;
    border-radius: 0;
    color: var(--text-primary);
  }

  .queue-main {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: auto auto 1fr;
    align-items: baseline;
    gap: 6px;
    background: transparent;
    border: 0;
    color: inherit;
    cursor: pointer;
    min-height: 36px;
    text-align: left;
    padding: 0;
  }

  .queue-item:hover, .queue-item:focus-within { background: #25252c; }

  .drag-handle {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    color: #c5c5d4;
    background: #121217;
    border: 1px solid var(--border);
    font-size: 16px;
    line-height: 1;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }

  .card-move {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .station-route {
    width: 84px;
    min-height: 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #121217;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 0 4px;
  }

  body.is-mouse-drag .drag-handle { cursor: grabbing; }

  .is-drag-source { opacity: 0.45; }

  body.is-mouse-drag .station-slot,
  body.is-mouse-drag .queue-list {
    border-radius: var(--radius);
    outline: 2px dashed var(--action-blue);
    outline-offset: -2px;
  }

  body.is-mouse-drag .station-slot.is-drop-over,
  body.is-mouse-drag .queue-list.is-drop-over {
    outline-color: #fff;
    background: rgba(52, 152, 219, 0.16);
  }

  .drop-hint {
    display: none;
    pointer-events: none;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }

  body.is-mouse-drag .drop-hint { display: block; }
  body.is-mouse-drag .empty-rest { display: none; }

  .station-slot { position: relative; }

  body.is-mouse-drag .station-slot > .drop-hint {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 4;
    padding: 8px;
    border-radius: var(--radius);
    background: rgba(18, 18, 23, 0.88);
    border: 2px dashed var(--action-blue);
  }

  .queue-no {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 16px;
    font-weight: 800;
  }

  .queue-tag {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.6;
  }

  .queue-meta {
    font-size: 10px;
    color: var(--text-secondary);
    opacity: 0.7;
    justify-self: end;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .station-empty {
    border: 1px dashed var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 100%;
    background: #18181e;
    padding: 8px;
    border-radius: var(--radius);
    font-size: 12px;
  }

  .station-card {
    background: #18181e;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
    overflow: auto;
    padding: 8px;
    border-radius: var(--radius);
  }

  .station-id {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .station-id-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .station-no {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(28px, 3.6vw, 40px);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 0.9;
    color: #fff;
  }

  .station-sex {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.6;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  .station-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 6px;
  }

  .station-facts .label,
  .anatomy h3,
  .station-pyrat .label {
    display: block;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: 0.6;
    line-height: 1.2;
    margin-bottom: 1px;
  }

  .station-facts .value {
    display: block;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.45rem;
    font-weight: 800;
    color: #fff;
    line-height: 1;
  }

  .station-badges {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    flex-shrink: 0;
  }

  .station-pyrat .value {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .geno-label {
    font-size: 10px;
    font-weight: 500;
    opacity: 0.55;
    color: var(--text-secondary);
  }

  .station-times {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }

  .station-times.times-one { grid-template-columns: 1fr; }

  .btn-sac, .btn-blood, .stamp {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 1.05rem;
    font-weight: 700;
  }

  .stamp {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 0;
    cursor: default;
    gap: 1px;
  }

  .stamp .stamp-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.55;
  }

  .stamp .stamp-time {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.25rem;
    font-weight: 800;
    line-height: 1;
  }

  .stamp:hover, .stamp:focus { filter: none; outline: none; }

  .stamp-sac,
  .stamp-sac:hover,
  .stamp-sac:focus { background: #102820; color: #8ee0b8; }

  .stamp-blood,
  .stamp-blood:hover,
  .stamp-blood:focus { background: #102a3d; color: #8ec8ee; }

  .anatomy {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .anatomy h3 { margin: 0; }

  .actions, .modal-actions, .chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .chip-grid {
    gap: 3px;
  }

  .chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 4px 8px;
    border: 1px solid #3a3a46;
    border-radius: var(--radius);
    background: #16161c;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 500;
    opacity: 0.85;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .chip-name { opacity: 0.7; font-weight: 500; }
  .chip.is-selected {
    opacity: 1;
    color: var(--text-primary);
    outline: 1px solid #e0e0e0;
    outline-offset: 1px;
  }
  .chip.is-selected .chip-name { opacity: 1; }
  .chip .dots { display: inline-flex; gap: 3px; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-missing { background: var(--exception-pink); }
  .dot-path { background: var(--action-blue); }
  .dot-swap { background: #c4a035; }
  .chip.is-missing { box-shadow: inset 3px 0 0 var(--exception-pink); }
  .chip.is-path { box-shadow: inset 3px 0 0 var(--action-blue); }
  .chip.is-swap { box-shadow: inset 3px 0 0 #c4a035; }
  .chip.is-missing.is-path,
  .chip.is-missing.is-swap,
  .chip.is-path.is-swap {
    box-shadow: none;
  }

  .station-tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }

  .btn {
    min-height: var(--touch);
    padding: 0 10px;
    border: 0;
    border-radius: var(--radius);
    background: var(--btn);
    color: var(--text-primary);
    cursor: pointer;
    font-weight: 600;
  }

  .btn:disabled {
    opacity: 1;
    cursor: not-allowed;
  }

  .btn-primary { background: var(--action-blue); color: #fff; }
  .btn-danger { background: var(--exception-pink); color: #fff; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    min-height: 28px;
    font-size: 11px;
    font-weight: 500;
  }
  .btn-sm { min-height: 28px; width: auto; }

  .btn.btn-sac {
    background: var(--action-green);
    color: #06150f;
    min-height: 48px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .btn.btn-blood {
    background: var(--action-blue);
    color: #fff;
    min-height: 48px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .btn.btn-blood:disabled,
  .btn.btn-blood.is-locked {
    background: #2a2a32;
    color: #5a5a68;
    cursor: not-allowed;
  }
  .btn.btn-tool {
    min-height: 34px;
    padding: 0 8px;
    background: #25252c;
    border: 1px solid var(--border);
    color: #c8c8d0;
    font-size: 11px;
    font-weight: 600;
    width: 100%;
    border-radius: var(--radius);
  }
  .btn.btn-tool:hover, .btn.btn-tool:focus {
    background: #2e2e38;
    color: #fff;
  }
  .btn.btn-tool:disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #1a1a20;
    color: #5c5c68;
  }
  .btn.btn-missing {
    align-self: flex-start;
    min-height: 28px;
    padding: 0 10px;
    background: transparent;
    border: 1px solid var(--exception-pink);
    color: #d08993;
    font-size: 11px;
    font-weight: 600;
    width: auto;
    border-radius: var(--radius);
  }
  .btn.btn-missing:hover, .btn.btn-missing:focus {
    background: rgba(176, 72, 86, 0.18);
    color: #f0c4ca;
  }
  .btn.btn-next {
    width: 100%;
    min-height: 40px;
    border-radius: var(--radius);
    font-size: 13px;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.62);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 12px;
  }

  .modal-card {
    background: var(--card-background);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    width: min(460px, 100%);
    max-height: 90vh;
    overflow: auto;
  }

  .modal-card h3 { margin: 0 0 10px; font-size: 15px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .field select, .field input {
    min-height: var(--touch);
    background: #16161c;
    color: var(--text-primary);

  var TRACKER_LIGHT_ = { ping: 1, getRequestResult: 1, loadPlanningSheet: 1, listPlanningFiles: 1 };

  function newRequestId_() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 14);
  }

  function gasRun(name, arg) {
    var execUrl = String((pipeline && pipeline.execUrl) || window.PIPELINE_EXEC_URL || '').trim();
    if (execUrl) {
      var requestBody = { action: name, payload: arguments.length > 1 ? arg : {} };
      if (name === 'saveSessionData' && requestBody.payload && typeof requestBody.payload === 'object') {
        if (!requestBody.payload.requestId) requestBody.payload.requestId = newRequestId_();
        requestBody.requestId = requestBody.payload.requestId;
        return callSave_(execUrl, requestBody, 2);
      }
      return sendTrackerJson_(execUrl, requestBody);
    }
    var runner = window.google && google.script && google.script.run;
    if (runner && runner.withSuccessHandler) {
      return new Promise(function (resolve, reject) {
        var call = runner.withSuccessHandler(resolve).withFailureHandler(reject);
        if (arguments.length > 1) call[name](arg);
        else call[name]();
      });
    }
    return Promise.reject(new Error('Apps Script is not available'));
  }

  function trackerServiceSnippet_(text) {
    return String(text || '')
      .replace(/<script[\s\S]*?<\/script>/gi, ' ')
      .replace(/<style[\s\S]*?<\/style>/gi, ' ')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 120);
  }

  function trackerNonJsonError_(status, text) {
    var detail = 'HTTP ' + String(status || 0);
    var snippet = trackerServiceSnippet_(text);
    if (snippet) detail += ': ' + snippet;
    return new Error('The lab service did not return JSON (' + detail + ')');
  }

  function trackerGetUrl_(execUrl, requestBody) {
    var joiner = String(execUrl).indexOf('?') >= 0 ? '&' : '?';
    return execUrl + joiner + 'payload=' + encodeURIComponent(JSON.stringify(requestBody)) + '&t=' + Date.now();
  }

  function trackerPrefersGet_(execUrl, requestBody) {
    if (!TRACKER_LIGHT_[requestBody.action]) return false;
    return trackerGetUrl_(execUrl, requestBody).length <= 1800;
  }

  function fetchTrackerOnce_(execUrl, requestBody, useGet) {
    if (useGet) {
      return fetch(trackerGetUrl_(execUrl, requestBody), {
        method: 'GET',
        redirect: 'follow',
        credentials: 'omit',
        cache: 'no-store'
      });
    }
    return fetch(execUrl, {
      method: 'POST',
      redirect: 'follow',
      credentials: 'omit',
      cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(requestBody)
    });
  }

  function trackerDriveMiss_(status, text) {
    var blob = String(text || '');
    if (Number(status) === 404) return true;
    return blob.indexOf('unable to open the file') !== -1 || blob.indexOf('<html') !== -1;
  }

  function parseTrackerBody_(status, text) {
    try {
      return JSON.parse(text);
    } catch (error) {
      var parseError = trackerNonJsonError_(status, text);
      parseError.driveMiss = trackerDriveMiss_(status, text);
      throw parseError;
    }
  }

  function acceptTrackerBody_(body) {
    if (!body || !body.ok) throw new Error((body && body.error) || 'Request failed');
    return body.data;
  }

  function trackerShouldPoll_(body) {
    if (!body || body.ok) return false;
    var message = String(body.error || '');
    return message === 'REQUEST_PENDING' || message.indexOf('lab pipeline is busy') !== -1;
  }

  function sendTrackerJson_(execUrl, requestBody) {
    var preferGet = trackerPrefersGet_(execUrl, requestBody);
    return fetchTrackerOnce_(execUrl, requestBody, preferGet).then(function (response) {
      return response.text().then(function (text) {
        try {
          return acceptTrackerBody_(parseTrackerBody_(response.status, text));
        } catch (error) {
          if (!error || !error.driveMiss) throw error;
          return fetchTrackerOnce_(execUrl, requestBody, !preferGet).then(function (retry) {
            return retry.text().then(function (retryText) {
              return acceptTrackerBody_(parseTrackerBody_(retry.status, retryText));
            });
          });
        }
      });
    }, function () {
      return fetchTrackerOnce_(execUrl, requestBody, !preferGet).then(function (retry) {
        return retry.text().then(function (retryText) {
          return acceptTrackerBody_(parseTrackerBody_(retry.status, retryText));
        });

    return new Promise(function (resolve) { setTimeout(resolve, ms); });

    return fetchTrackerOnce_(execUrl, requestBody, false).then(function (response) {

    if (pendingPolls > 80) {
      return Promise.reject(new Error('The lab service did not return JSON (HTTP 404)'));

    return sendTrackerJson_(execUrl, {

      requestId: requestBody.requestId

      if (ticket && ticket.status === 'DONE') {

          return pollSave_(execUrl, requestBody, invokesLeft, misses, pendingPolls);
        });
      }
      if (invokesLeft <= 0) throw new Error('The lab service did not return JSON (HTTP 404)');
      return callSave_(execUrl, requestBody, invokesLeft - 1);
    }, function () {
      var misses = notFoundStreak + 1;
      if (misses < 4) {
        return waitMs_(1500).then(function () {
          return pollSave_(execUrl, requestBody, invokesLeft, misses, pendingPolls);
        });
      }
      if (invokesLeft <= 0) throw new Error('The lab service did not return JSON (HTTP 404)');
